[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelgrab"
version = "0.3.0"
description = "Short-form video grabber for Matrix (appservice + yt-dlp)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "reelgrab contributors" }]
dependencies = [
  "yt-dlp>=2024.1.0",
  "PyYAML>=6.0",
  "aiohttp>=3.9.0",
  "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = ["unittest-xml-reporting; python_version<'0'"]  # placeholder; use stdlib unittest

[project.scripts]
reelgrab = "reelgrab.__main__:main"

[tool.setuptools.packages.find]
include = ["reelgrab*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
