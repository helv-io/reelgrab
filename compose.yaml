# reelgrab — short-form video grabber for Matrix (appservice)
#
# Image options:
#   image: helvio/reelgrab:latest   # Docker Hub (CI multi-arch)
#   image: reelgrab:local && build: .   # local build
#
# First-time setup:
#   mkdir -p data
#   docker compose run --rm reelgrab
#   $EDITOR data/config.yaml
#     homeserver.address:  http://synapse:8008   # internal CS API
#     homeserver.domain:   example.com           # server_name
#     bot.admin_users:     ["@you:example.com"]
#   docker compose run --rm reelgrab             # tokens + registration.yaml
#   # Install data/registration.yaml on the homeserver, restart HS
#   docker compose up -d
#
# This host (helv): attach to network "web" (see networks below) or use
#   network_mode: "web"
# and homeserver.address: http://synapse:8008

services:
  reelgrab:
    container_name: reelgrab
    image: helvio/reelgrab:latest
    # Local build instead of Hub:
    # image: reelgrab:local
    # build: .
    # Exit 0 after generating config must not restart-loop
    restart: on-failure
    volumes:
      # config.yaml, registration.yaml, cookies, downloads, runtime_state
      - ./data:/data
      # Uncomment if download.backend: metube
      # - /docker/metube:/downloads:ro
    environment:
      TZ: America/New_York
      REELGRAB_DATA: /data
      REELGRAB_DOCKER: "1"
    # --- pick ONE network style ---
    # A) Same Docker network as Synapse (preferred). Name must match your stack.
    networks:
      - matrix
    # B) This host uses network_mode: web for Matrix services — alternative:
    # network_mode: web
    # (comment out networks: above if you use network_mode)

networks:
  matrix:
    # Join an existing compose network (set the real name), e.g.:
    #   docker network ls | grep -E 'matrix|web'
    # external: true
    # name: web
    external: false
