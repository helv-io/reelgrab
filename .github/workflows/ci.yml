name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # python-olm 3.2.16 builds libolm from source on 3.13 (3.11 and 3.12
      # install a wheel). libolm's CMakeLists asks for 3.4, which CMake 4
      # on ubuntu-latest rejects. CMake 3.x ignores this variable.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and ruff
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Ruff
        run: ruff check .

      - name: Unit tests
        run: python -m unittest discover -s tests -v
