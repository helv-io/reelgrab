# Build multi-arch images and publish to Docker Hub (helvio/*).
#
# Required repository configuration:
#
#   Variables (Settings → Secrets and variables → Actions → Variables):
#     DOCKERHUB_USERNAME   Docker Hub username (e.g. helvio)
#
#   Secrets (Settings → Secrets and variables → Actions → Secrets):
#     DOCKERHUB_TOKEN      Docker Hub access token (not password)
#
# Image: docker.io/<DOCKERHUB_USERNAME>/reelgrab
# Platforms: linux/amd64, linux/arm64

name: Docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  # Weekly rebuild so the image picks up a current yt-dlp (the package is
  # installed at image build time, not on container start).
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  IMAGE_NAME: reelgrab

jobs:
  docker:
    name: Build & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Docker Hub username
        id: hub
        run: |
          USERNAME="${{ vars.DOCKERHUB_USERNAME }}"
          if [ -z "$USERNAME" ]; then
            USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          fi
          if [ -z "$USERNAME" ]; then
            echo "DOCKERHUB_USERNAME is not set (repo Variable or Secret)." >&2
            exit 1
          fi
          echo "username=${USERNAME}" >> "$GITHUB_OUTPUT"
          echo "image=docker.io/${USERNAME}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Docker meta (tags / labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.hub.outputs.image }}
          # latest=auto (the default) also tags :latest for every semver
          # release. Disable it so only the rule below can publish :latest.
          flavor: |
            latest=false
          tags: |
            # :latest when this run's ref is the default branch: a push to
            # main, the weekly rebuild, or a manual dispatch of that branch.
            # A version tag must not move it. Tag jobs finish out of order,
            # and the last one would otherwise own :latest.
            type=raw,value=latest,enable={{is_default_branch}}
            # v1.2.3 → 1.2.3. No floating major or minor tags; those raced
            # the same way as :latest.
            type=semver,pattern={{version}}
            # branch slug
            type=ref,event=branch
            # PR number (build only; not pushed unless you enable push on PR)
            type=ref,event=pr
            # short SHA always
            type=sha,prefix=sha-

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ steps.hub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          # Push only outside PRs (PRs still multi-arch build as a check)
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
